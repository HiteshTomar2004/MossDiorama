<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Top Moss Gradient -->
    <linearGradient id="mossTop" x1="16" y1="14" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Moss Overhang Accent -->
    <linearGradient id="mossEdge" x1="10" y1="28" x2="54" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Earth Left Face -->
    <linearGradient id="earthLeft" x1="10" y1="28" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b2b1d"/>
      <stop offset="100%" stop-color="#241a12"/>
    </linearGradient>

    <!-- Earth Right Face -->
    <linearGradient id="earthRight" x1="32" y1="28" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#261b12"/>
      <stop offset="100%" stop-color="#140e0a"/>
    </linearGradient>

    <!-- Warm Fire Glow -->
    <radialGradient id="hearthGlow" cx="32" cy="24" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="32" y1="29" x2="32" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="6" y="10" width="52" height="52" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- 1. Loam / Rock Left Face -->
    <path d="M10 28 L32 40 L32 56 L10 44 Z" fill="url(#earthLeft)"/>

    <!-- 2. Loam / Rock Right Face -->
    <path d="M32 40 L54 28 L54 44 L32 56 Z" fill="url(#earthRight)"/>

    <!-- Earth Strata / Stone Inset Details -->
    <path d="M10 37 L32 49 L32 51 L10 39 Z" fill="#1b120c" opacity="0.6"/>
    <path d="M32 49 L54 37 L54 39 L32 51 Z" fill="#0d0805" opacity="0.6"/>

    <!-- 3. Top Moss Turf Platform -->
    <path d="M32 16 L54 28 L32 40 L10 28 Z" fill="url(#mossTop)"/>

    <!-- Organic Moss Overhang Lips / Scallops -->
    <path d="M10 28 Q15 34 20 31 Q26 37 32 40 Q38 37 44 31 Q49 34 54 28 L54 31 Q48 37 42 34 Q36 43 32 43 Q28 43 22 34 Q16 37 10 31 Z" fill="url(#mossEdge)"/>

    <!-- Moss Tufts on Surface -->
    <ellipse cx="23" cy="27" rx="3.5" ry="1.8" fill="#6ee7b7" opacity="0.4"/>
    <ellipse cx="40" cy="29" rx="2.5" ry="1.4" fill="#a7f3d0" opacity="0.45"/>
    <ellipse cx="33" cy="35" rx="3" ry="1.5" fill="#34d399" opacity="0.5"/>

    <!-- 4. Miniature Campfire Hearth Stones -->
    <ellipse cx="32" cy="27.5" rx="8" ry="4.2" fill="#1c1917" opacity="0.75"/>
    <circle cx="26" cy="27.5" r="1.8" fill="#57534e"/>
    <circle cx="28.5" cy="29.5" r="1.7" fill="#78716c"/>
    <circle cx="32" cy="30.2" r="1.8" fill="#57534e"/>
    <circle cx="35.5" cy="29.5" r="1.7" fill="#78716c"/>
    <circle cx="38" cy="27.5" r="1.8" fill="#57534e"/>
    <circle cx="35" cy="25.5" r="1.6" fill="#78716c"/>
    <circle cx="29" cy="25.5" r="1.6" fill="#57534e"/>

    <!-- Hearth Glow Aura -->
    <circle cx="32" cy="24" r="11" fill="url(#hearthGlow)"/>

    <!-- Stylized Campfire Flame -->
    <path d="M32 14 C33.5 17.5 36.5 19.5 36 23 C35.5 26.5 33.5 28 32 28 C30.5 28 28.5 26.5 28 23 C27.5 19.5 30.5 17.5 32 14 Z" fill="url(#flameGrad)"/>
    <!-- Inner Golden Flame Core -->
    <path d="M32 18 C33 20 34.5 21.5 34 24 C33.6 26 32.8 27 32 27 C31.2 27 30.4 26 30 24 C29.5 21.5 31 20 32 18 Z" fill="#fffbeb"/>

    <!-- Tiny Rising Ember Sparks -->
    <circle cx="29" cy="13" r="0.9" fill="#fef08a"/>
    <circle cx="35.5" cy="11.5" r="0.8" fill="#fde047"/>
    <circle cx="32" cy="8.5" r="0.7" fill="#fbbf24"/>
  </g>
</svg>